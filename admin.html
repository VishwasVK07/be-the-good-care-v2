<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Admin Dashboard</h1>
  </header>

  <main>

    <!-- Shown when nobody is logged in -->
    <section id="login-section">
      <h2>Admin Login</h2>
      <form id="login-form">

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit">Log In</button>
        <p id="login-message" role="alert"></p>

      </form>
    </section>

    <!-- Shown only after a successful login -->
    <section id="dashboard-section" hidden>
      <h2>Welcome</h2>
      <p>You are logged in. Stats will appear here soon.</p>
      <button type="button" id="logout-button">Log Out</button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>

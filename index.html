<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Feedback Form</title>

 
  <link rel="stylesheet" href="style.css"> 

</head>
<body>

  <header>
    <h1>Patient Feedback Form</h1>
    <p>Tell us about your recent experience. Your response is completely anonymous.</p>
  </header>

  <main>
    <form id="survey-form" action="#" method="post">

      <!-- Step 1: Choose the healthcare professional -->
      <div class="form-group">
        <label for="provider">Who cared for you?</label>
        <select id="provider" name="provider_id" required>
  <option value="" disabled selected>Select a healthcare professional</option>
</select>
      </div>

      <!-- Step 2: Rating from 1 to 5 -->
      <fieldset class="form-group">
        <legend>How would you rate your experience?</legend>

        <input type="radio" id="rating-1" name="rating" value="1" required>
        <label for="rating-1">1 - Very Poor</label>

        <input type="radio" id="rating-2" name="rating" value="2">
        <label for="rating-2">2 - Poor</label>

        <input type="radio" id="rating-3" name="rating" value="3">
        <label for="rating-3">3 - Okay</label>

        <input type="radio" id="rating-4" name="rating" value="4">
        <label for="rating-4">4 - Good</label>

        <input type="radio" id="rating-5" name="rating" value="5">
        <label for="rating-5">5 - Excellent</label>
      </fieldset>

      <!-- Step 3: Optional comments -->
      <div class="form-group">
        <label for="comments">Comments (optional)</label>
        <textarea id="comments" name="comments" rows="5" maxlength="1000"
                  placeholder="Tell us what went well or what could be better."
                  aria-describedby="comments-note"></textarea>
        <p id="comments-note">
          Please do not include your name, health details, or other personal information.
        </p>
      </div>

      <button type="submit">Submit Feedback</button>
            <p id="form-message" role="status"></p>

    </form>
  </main>

  <footer>
    <p>Your feedback helps us improve patient care.</p>
  </footer>

  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
